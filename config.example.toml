base_url = "https://your-rpa-host.example.com"
check_keyword = ""

[user]
username = "your-username"
password = "change-me"
userID = [1]

[component]
tag_id = "5"                 # 3.0模板网银组件
default_maintainer_id = "30" # 开发人 / 负责人（徐文超）
default_version = "3.0.0"
approve_status = "31"        # 批准；32=驳回

[component.default_info]
系统版本 = "Microsoft Windows Server 2019 Standard"
浏览器 = "Google"
场景 = "网银"
验证类型 = "无验证"
区域 = "其他"

[llm]
enabled = false
token = "replace-with-zhipu-api-key"

[smtp]
server = "smtp.example.com"
port = 465
sender = "bot@example.com"
pwd = "replace-with-smtp-password"

[DingTalk]
access_token = "replace-with-dingtalk-access-token"
secret = "replace-with-dingtalk-secret"

[send_group]
access_token = "replace-with-group-access-token"
secret = "replace-with-group-secret"

[notifications]
approval_email_recipients = ["owner@example.com"]
approval_at_mobiles = []
